name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png assets/
          python3 - <<'PY'
          p='www/index.html'
          s=open(p,encoding='utf-8').read()
          add="<script>(function(){var o=window.print;window.print=function(){if(window.AndroidPrint)window.AndroidPrint.print();else if(o)o.call(window)}})();</script>\n</body>"
          s=s.replace('</body>',add,1)
          open(p,'w',encoding='utf-8').write(s)
          PY

      - name: Install and add Android
        run: |
          npm install
          npx cap add android

      - name: App icon
        run: npx --yes @capacitor/assets generate --android || echo "icon step skipped"

      - name: Print support + version + fixed signing key
        run: |
          mkdir -p android/app/src/main/java/com/ahad/pharmacypos
          cat > android/app/src/main/java/com/ahad/pharmacypos/MainActivity.java <<'JAVA'
          package com.ahad.pharmacypos;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              final WebView web = getBridge().getWebView();
              web.addJavascriptInterface(new Object() {
                @JavascriptInterface
                public void print() {
                  runOnUiThread(new Runnable() {
                    public void run() {
                      PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                      PrintDocumentAdapter a = web.createPrintDocumentAdapter("Pharmacy POS");
                      pm.print("Pharmacy POS", a, new PrintAttributes.Builder().build());
                    }
                  });
                }
              }, "AndroidPrint");
            }
          }
          JAVA
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Pharmacy-POS.apk
          # publish

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Pharmacy POS APK
          make_latest: true
          files: Pharmacy-POS.apk
